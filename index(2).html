<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>搭子行 TripSync</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="tb-left">
      <div class="room" data-act="settings" style="cursor:pointer">
        <h1 id="roomName">三亚 · 4天3晚</h1>
        <p id="roomMeta">3 天</p>
      </div>
    </div>
    <div class="tb-right">
      <div class="members" id="members"></div>
      <button class="icon-btn" data-act="sync" id="syncBtn" title="同步设置">☁</button>
      <button class="icon-btn" data-act="reset" title="重置演示数据">⟳</button>
    </div>
  </header>

  <div class="budget" id="budgetStrip"></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="alert" id="alertBar" hidden></div>

  <main class="layout">
    <section class="panel" id="panel"></section>
    <aside class="mapwrap" id="mapPanel"></aside>
  </main>

  <footer class="foot">
    <span>演示模式 · 数据存于本机浏览器</span>
    <span>可切换 A/B 身份模拟双人协同</span>
  </footer>
</div>

<div class="mask" id="mask" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
